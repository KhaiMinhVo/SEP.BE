# --------------------------------------------------------------------------------------------------------------------------
#  InfluencerMatch Backend --Application Configuration
#  Environment: Development (default)
# --------------------------------------------------------------------------------------------------------------------------

server:
  port: 8080
  servlet:
    context-path: /api/v1
  error:
    include-message: never          # Never expose internal error messages to clients
    include-binding-errors: never
    include-stacktrace: never

spring:
  profiles:
    default: dev
  config:
    import: optional:file:.env[.properties]
  application:
    name: influencermatch-backend

  # ------------------------------------------------------------------------------------
  #  DataSource
  # ------------------------------------------------------------------------------------
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:influencermatch_dev}
    username: ${DB_USER:influencermatch_user}
    password: ${DB_PASS:12345}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: InfluencerMatchHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  # ------------------------------------------------------------------------------------
  #  JPA / Hibernate
  # ------------------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        globally_quoted_identifiers: true
        jdbc:
          time_zone: UTC
        default_schema: public
    open-in-view: false             # Disable OSIV to avoid lazy-loading pitfalls

  # ------------------------------------------------------------------------------------
  #  Jackson
  # ------------------------------------------------------------------------------------
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

# ------------------------------------------------------------------------------------
#  JWT Security
# ------------------------------------------------------------------------------------
application:
  oauth2:
    google:
      enabled: ${GOOGLE_OAUTH_ENABLED:false}
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      frontend-callback-url: ${GOOGLE_FRONTEND_CALLBACK_URL:http://localhost:5173/auth/google/callback}
      exchange-code-ttl-seconds: 60
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:System Administrator}
  security:
    jwt:
      # Replace with a 256-bit Base64-encoded secret in production via env var
      secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: ${JWT_EXPIRATION:900000} # 15 minutes
      refresh-token:
        expiration: 604800000      # 7 days in milliseconds
  
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:RIQUTV9F}
    hash-secret: ${VNPAY_HASH_SECRET:ISSOCEDZRBG9X0KTUWI42S8TGUFWNPV7}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/billing/vnpay/return}

# ------------------------------------------------------------------------------------
#  SpringDoc / OpenAPI (Swagger UI)
# ------------------------------------------------------------------------------------
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    try-it-out-enabled: true
  show-actuator: false

# ------------------------------------------------------------------------------------
#  Logging
# ------------------------------------------------------------------------------------
logging:
  level:
    root: INFO
    com.influencermatch: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
management:
  endpoints:
    web:
      exposure:
        include: health,info
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"

