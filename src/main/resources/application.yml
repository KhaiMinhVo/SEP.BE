# --------------------------------------------------------------------------------------------------------------------------
#  InfluencerMatch Backend --Application Configuration
#  Environment: Development (default)
# --------------------------------------------------------------------------------------------------------------------------

server:
  port: 8080
  servlet:
    context-path: /api/v1
  error:
    include-message: never          # Never expose internal error messages to clients
    include-binding-errors: never
    include-stacktrace: never          # Never expose internal error messages to clients

spring:
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS_ENABLED:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS_REQUIRED:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  profiles:
    default: dev
  config:
    import: optional:file:.env[.properties]
  application:
    name: influencermatch-backend

  # ------------------------------------------------------------------------------------
  #  DataSource
  # ------------------------------------------------------------------------------------
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:influencermatch_dev}
    username: ${DB_USER:influencermatch_user}
    password: ${DB_PASS:12345}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: InfluencerMatchHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  # ------------------------------------------------------------------------------------
  #  JPA / Hibernate
  # ------------------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        globally_quoted_identifiers: true
        jdbc:
          time_zone: UTC
        default_schema: public
    open-in-view: false             # Disable OSIV to avoid lazy-loading pitfalls

  # ------------------------------------------------------------------------------------
  #  Jackson
  # ------------------------------------------------------------------------------------
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

# ------------------------------------------------------------------------------------
#  JWT Security
# ------------------------------------------------------------------------------------
application:
  claim-email:
    encryption-key: ${EMAIL_OUTBOX_ENCRYPTION_KEY:}
    dispatch-enabled: ${CLAIM_EMAIL_DISPATCH_ENABLED:true}
  auth:
    email-verification:
      enabled: ${EMAIL_VERIFICATION_ENABLED:false}
      from: ${SMTP_FROM:}
      secret: ${EMAIL_OTP_SECRET:}
    creator-invitation:
      frontend-base-url: ${CREATOR_INVITATION_FRONTEND_BASE_URL:http://localhost:5173}
    social-proof-mock:
      enabled: ${SOCIAL_PROOF_MOCK_ENABLED:false}
    creator-mock:
      enabled: ${CREATOR_MOCK_LOGIN_ENABLED:false}
  payment:
    mock:
      enabled: ${PAYMENT_MOCK_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:System Administrator}
  security:
    jwt:
      # Replace with a 256-bit Base64-encoded secret in production via env var
      secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: ${JWT_EXPIRATION:900000} # 15 minutes
      refresh-token:
        expiration: 604800000      # 7 days in milliseconds
    oauth-token:
      secret-key: ${OAUTH_TOKEN_SECRET_KEY:dGhpc0lzQTI1NkJpdFNlY3JldEtleUZvck9BdXRoVG9rZW5zIQ==}
  
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:RIQUTV9F}
    hash-secret: ${VNPAY_HASH_SECRET:ISSOCEDZRBG9X0KTUWI42S8TGUFWNPV7}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/billing/vnpay/return}

# ------------------------------------------------------------------------------------
#  SpringDoc / OpenAPI (Swagger UI)
# ------------------------------------------------------------------------------------
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    try-it-out-enabled: true
  show-actuator: false

# ------------------------------------------------------------------------------------
#  Logging
# ------------------------------------------------------------------------------------
logging:
  level:
    root: INFO
    com.influencermatch: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
management:
  endpoints:
    web:
      exposure:
        include: health,info
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"

# ------------------------------------------------------------------------------------
#  AI Service (Python FastAPI)
# ------------------------------------------------------------------------------------
ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000/api/v1/ai/embed}

# ------------------------------------------------------------------------------------
#  Gemini AI (Google â€“ Campaign Autofill)
# ------------------------------------------------------------------------------------
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.0-flash}
  base-url: https://generativelanguage.googleapis.com/v1beta/models
  max-output-tokens: 1024
  temperature: 0.3
