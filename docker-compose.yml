# ─────────────────────────────────────────────────────────────
#  InfluencerMatch – Local Development Services
# ─────────────────────────────────────────────────────────────

services:

  postgres:
    image: postgres:16-alpine
    container_name: influencermatch_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-influencermatch_dev}
      POSTGRES_USER: ${DB_USER:-influencermatch_user}
      POSTGRES_PASSWORD: ${DB_PASS:-12345}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
