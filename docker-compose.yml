# ─────────────────────────────────────────────────────────────
#  InfluencerMatch – Local Development Services
# ─────────────────────────────────────────────────────────────

services:

  redis:
    image: redis:7-alpine
    container_name: influencermatch_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    container_name: influencermatch_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-influencermatch_dev}
      POSTGRES_USER: ${DB_USER:-influencermatch_user}
      POSTGRES_PASSWORD: ${DB_PASS:-12345}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VCS_REF: ${DEPLOY_COMMIT:-unknown}
    container_name: influencermatch_api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CREATOR_INVITATION_FRONTEND_BASE_URL: ${CREATOR_INVITATION_FRONTEND_BASE_URL:-http://localhost:5173}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-influencermatch_dev}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-influencermatch_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS:-12345}
      META_OAUTH_ENABLED: ${META_OAUTH_ENABLED:-false}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_LOGIN_CONFIG_ID: ${META_LOGIN_CONFIG_ID:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v26.0}
      META_REDIRECT_URI: ${META_REDIRECT_URI:-https://www.influencermatch.site/api/v1/integrations/meta/callback}
      META_OAUTH_ENCRYPTION_KEY: ${META_OAUTH_ENCRYPTION_KEY:-}
      INSTAGRAM_UNIFIED_OAUTH_ENABLED: ${INSTAGRAM_UNIFIED_OAUTH_ENABLED:-false}
      INSTAGRAM_UNIFIED_APP_ID: ${INSTAGRAM_UNIFIED_APP_ID:-976403021867954}
      INSTAGRAM_UNIFIED_APP_SECRET: ${INSTAGRAM_UNIFIED_APP_SECRET:-}
      INSTAGRAM_UNIFIED_LOGIN_CONFIG_ID: ${INSTAGRAM_UNIFIED_LOGIN_CONFIG_ID:-1176260962020417}
      INSTAGRAM_UNIFIED_GRAPH_API_VERSION: ${INSTAGRAM_UNIFIED_GRAPH_API_VERSION:-v26.0}
      INSTAGRAM_UNIFIED_REDIRECT_URI: ${INSTAGRAM_UNIFIED_REDIRECT_URI:-https://www.influencermatch.site/api/v1/integrations/instagram-unified/callback}
      INSTAGRAM_UNIFIED_OAUTH_ENCRYPTION_KEY: ${INSTAGRAM_UNIFIED_OAUTH_ENCRYPTION_KEY:-}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://host.docker.internal:8000/api/v1/ai/embed}
      CRAWLER_SERVICE_URL: ${CRAWLER_SERVICE_URL:-http://host.docker.internal:8000/api/v1/crawl}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      PAYOS_CALLBACK_URL: ${PAYOS_CALLBACK_URL:-https://api.influencermatch.site/api/v1/billing/payos/return}
      PAYOS_CANCEL_CALLBACK_URL: ${PAYOS_CANCEL_CALLBACK_URL:-https://api.influencermatch.site/api/v1/billing/payos/return}
      PAYOS_FRONTEND_RETURN_URL: ${PAYOS_FRONTEND_RETURN_URL:-https://www.influencermatch.site/subscription}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/actuator/health/deployment | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
