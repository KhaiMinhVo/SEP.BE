# ─────────────────────────────────────────────────────────────
#  InfluencerMatch – Local Development Services
# ─────────────────────────────────────────────────────────────

services:

  postgres:
    image: postgres:16-alpine
    container_name: influencermatch_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-influencermatch_dev}
      POSTGRES_USER: ${DB_USER:-influencermatch_user}
      POSTGRES_PASSWORD: ${DB_PASS:-12345}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: influencermatch_api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-influencermatch_dev}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-influencermatch_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS:-12345}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  postgres_data:
    driver: local
